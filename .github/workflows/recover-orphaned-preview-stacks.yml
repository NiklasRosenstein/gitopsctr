name: Recover orphaned preview stacks

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to recover
        required: false
        type: string
      required_label:
        description: Optional pull-request label required for preview eligibility
        required: false
        type: string
      dry_run:
        description: Preview recovery only; defaults to true for manual runs
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: recover-orphaned-preview-stacks
  cancel-in-progress: false

jobs:
  recover:
    # Scheduled cleanup is opt-in. Manual runs can supply an environment input.
    if: github.event_name == 'workflow_dispatch' || (vars.GITOPSCTR_RECOVERY_ENABLED == 'true' && vars.PREVIEW_ENVIRONMENT != '')
    runs-on: ubuntu-latest
    env:
      PREVIEW_ENVIRONMENT: ${{ vars.PREVIEW_ENVIRONMENT }}
      PREVIEW_REQUIRED_LABEL: ${{ vars.PREVIEW_REQUIRED_LABEL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups

      - name: Recover orphaned stacks
        env:
          WORKFLOW_ENVIRONMENT: ${{ inputs.environment }}
          WORKFLOW_REQUIRED_LABEL: ${{ inputs.required_label }}
          WORKFLOW_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          environment="${WORKFLOW_ENVIRONMENT:-${PREVIEW_ENVIRONMENT:-}}"
          if [[ -z "$environment" ]]; then
            echo "No preview environment is configured. Set PREVIEW_ENVIRONMENT or provide the workflow input." >&2
            exit 1
          fi

          required_label="${WORKFLOW_REQUIRED_LABEL:-${PREVIEW_REQUIRED_LABEL:-}}"
          command=(uv run gitopsctr recover-orphaned-stacks --environment "$environment")
          if [[ -n "$required_label" ]]; then
            command+=(--required-label "$required_label")
          fi
          dry_run="${WORKFLOW_DRY_RUN:-}"
          if [[ -z "$dry_run" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              dry_run=true
            else
              dry_run=false
            fi
          fi
          case "$dry_run" in
            true) command+=(--dry) ;;
            false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          "${command[@]}"
