name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check src demo
      - run: uv run gitopsctr schemas export docs/schemas --check
      - run: uv run mkdocs build --strict
      - run: uv build

  test:
    env:
      # Captured test output is asserted as plain text; individual tests explicitly
      # opt into styling when they need to exercise terminal colors.
      NO_COLOR: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q

  acceptance:
    name: Real Docker/Terraform demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          install_args: python uv terraform
      - run: uv sync --locked --all-groups
      - name: Deploy and prove clean convergence
        run: mise run demo-acceptance
      - name: Clean up demo resources
        if: always()
        run: mise run demo-clean

  kubernetes-acceptance:
    name: Real Kubernetes demo (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          install_args: python uv helm kind kubectl
      - run: uv sync --locked --all-groups
      - name: Render, deploy, verify, and prove clean convergence
        run: mise run kubernetes-acceptance -- kind
      - name: Clean up Kubernetes resources
        if: always()
        run: mise run kubernetes-demo-clean -- kind

  argocd-acceptance:
    name: Argo CD Kubernetes demo (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          install_args: python uv helm kind kubectl
      - run: uv sync --locked --all-groups
      - name: Build, materialize, observe, and prove clean convergence
        run: mise run argocd-acceptance -- kind
      - name: Clean up Argo CD Kubernetes resources
        if: always()
        run: mise run argocd-demo-clean -- kind
