# yaml-language-server: $schema=https://niklasrosenstein.github.io/gitopsctr/schemas/apis/unit.gitopsctr.io/v1/KubernetesManifests/authored.schema.json
apiVersion: unit.gitopsctr.io/v1
kind: KubernetesManifests
metadata:
  name: web
spec:
  source:
    path: charts/web
    inputs: ["**/*"]
  materialize:
    type: helm
    releaseName: web
    namespace: default
    values:
      message: rendered and reconciled
      image:
        fromObservation: units/demo-image.yaml
        pointer: /artifacts/containers.json/artifacts/application/uri
    allowSecrets: false
  delivery:
    mode: direct
    kubeContext: __KUBE_CONTEXT__
    prune: false
    wait:
      - resource: deployment/gitopsctr-kubernetes-demo
        namespace: default
        condition: Available
        timeoutSeconds: 120
