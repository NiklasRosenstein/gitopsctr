site_name: gitopsctr
site_url: https://niklasrosenstein.github.io/gitopsctr/
repo_url: https://github.com/NiklasRosenstein/gitopsctr
repo_name: NiklasRosenstein/gitopsctr
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
nav:
  - Overview: index.md
  - Concepts: concepts.md
  - Getting started:
      - Local Docker tutorial: tutorial.md
  - Authoring:
      - Resources and API kinds: documents.md
      - Reference expressions: references.md
  - Controller APIs:
      - Project: project-configuration.md
      - Environment: apis/environment.md
      - Stacks and templates: apis/stacks.md
      - Promotion: apis/promotion.md
      - Receipt: apis/receipt.md
  - Artifact APIs:
      - Overview: apis/artifacts.md
      - Container images: apis/container-images.md
      - Frontend bundle: apis/frontend-bundle.md
  - Unit APIs:
      - Overview: drivers.md
      - Terraform: drivers/terraform.md
      - OCI images: drivers/oci-images.md
      - Vite OCI bundle: drivers/vite-oci-bundle.md
      - Frontend S3/CloudFront: drivers/frontend-s3-cloudfront.md
      - Kubernetes manifests: drivers/kubernetes-manifests.md
  - Operations:
      - Workflow guide: operations.md
      - GitHub Action: github-action.md
      - Preview environments: preview-environments.md
  - Extending gitopsctr:
      - Driver execution: driver-execution.md
  - Reference:
      - Resource model: resource-model.md
      - JSON Schemas: schemas.md
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
strict: true
