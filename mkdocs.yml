site_name: gitopsctr
site_url: https://niklasrosenstein.github.io/gitopsctr/
repo_url: https://github.com/NiklasRosenstein/gitopsctr
repo_name: NiklasRosenstein/gitopsctr
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
nav:
  - Overview: index.md
  - Documents and unit drivers: documents.md
  - Available unit drivers:
      - Overview: drivers.md
      - Terraform: drivers/terraform.md
      - OCI images: drivers/oci-images.md
      - Vite OCI bundle: drivers/vite-oci-bundle.md
      - Frontend S3/CloudFront: drivers/frontend-s3-cloudfront.md
      - Kubernetes manifests: drivers/kubernetes-manifests.md
  - Project configuration: project-configuration.md
  - JSON Schemas: schemas.md
  - Driver execution: driver-execution.md
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
strict: true
