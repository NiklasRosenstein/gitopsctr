site_name: gitopsctr
site_url: https://niklasrosenstein.github.io/gitopsctr/
repo_url: https://github.com/NiklasRosenstein/gitopsctr
repo_name: NiklasRosenstein/gitopsctr
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
nav:
  - Overview: index.md
  - Getting started:
      - Local Docker tutorial: tutorial.md
  - Concepts: concepts.md
  - Authoring and APIs:
      - Resources and API kinds: documents.md
      - Project configuration: project-configuration.md
      - Reference expressions: references.md
  - Unit kinds:
      - Overview: drivers.md
      - Terraform: drivers/terraform.md
      - OCI images: drivers/oci-images.md
      - Vite OCI bundle: drivers/vite-oci-bundle.md
      - Frontend S3/CloudFront: drivers/frontend-s3-cloudfront.md
      - Kubernetes manifests: drivers/kubernetes-manifests.md
  - Operations:
      - Workflow guide: operations.md
      - GitHub Action: github-action.md
  - Extending gitopsctr:
      - Driver execution: driver-execution.md
  - Reference:
      - JSON Schemas: schemas.md
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
strict: true
