[tools]
actionlint = "latest"
oras = "latest"
helm = "latest"
kind = "0.32.0"
minikube = "1.38.1"
kubectl = "latest"
python = "3.12"
terraform = "latest"
uv = "latest"

[tasks.sync]
run = "uv sync --all-groups"

[tasks.test]
run = "uv run pytest -q"

[tasks.lint]
run = "uv run ruff check ."

[tasks.fmt]
run = "uv run ruff format ."

[tasks.typecheck]
run = "uv run ty check src demo"

[tasks.actionlint]
run = "actionlint"

[tasks.schemas]
run = "uv run gitopsctr schemas export docs/schemas"

[tasks.schemas-check]
run = "uv run gitopsctr schemas export docs/schemas --check"

[tasks.migrate-documents]
description = "Preview the one-shot JSON-to-YAML resource migration"
run = "uv run python tools/migrate_documents.py --project-name gitopsctr"

[tasks.docs]
run = "uv run mkdocs build --strict"

[tasks.docs-serve]
description = "Serve the documentation with live reload"
run = "uv run mkdocs serve"

[tasks.check]
depends = ["actionlint", "docs", "lint", "schemas-check", "typecheck", "test"]

[tasks.build]
run = "uv build"

[tasks.demo]
description = "Run the real local Docker/Terraform demo"
run = "uv run python -m demo.docker.run run"

[tasks.demo-reset]
description = "Recreate and run the local demo from scratch"
run = "uv run python -m demo.docker.run reset"

[tasks.demo-clean]
description = "Remove the local demo resources and state"
run = "uv run python -m demo.docker.run clean"

[tasks.demo-acceptance]
description = "Deploy, prove clean convergence, and clean the real local demo"
run = "uv run python -m demo.docker.run acceptance"

[tasks.kubernetes-demo]
description = "Build and deploy the demo to an explicitly selected kind or minikube cluster"
run = "uv run python -m demo.kubernetes.run run"

[tasks.kubernetes-demo-clean]
description = "Remove the explicitly selected Kubernetes demo cluster and state"
run = "uv run python -m demo.kubernetes.run clean"

[tasks.kubernetes-acceptance]
description = "Build, deploy, verify, prove clean convergence, and clean the selected Kubernetes demo"
run = "uv run python -m demo.kubernetes.run acceptance"

[tasks.argocd-demo]
description = "Build, materialize, and observe the selected Kubernetes demo through Argo CD"
run = "uv run python -m demo.kubernetes.run run --delivery argocd"

[tasks.argocd-demo-clean]
description = "Remove the selected Argo CD Kubernetes demo cluster and state"
run = "uv run python -m demo.kubernetes.run clean --delivery argocd"

[tasks.argocd-acceptance]
description = "Build, materialize, observe through Argo CD, and clean the selected Kubernetes demo"
run = "uv run python -m demo.kubernetes.run acceptance --delivery argocd"
