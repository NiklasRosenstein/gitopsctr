[tools]
actionlint = "latest"
oras = "latest"
python = "3.12"
terraform = "latest"
uv = "latest"

[tasks.sync]
run = "uv sync --all-groups"

[tasks.test]
run = "uv run pytest -q"

[tasks.lint]
run = "uv run ruff check ."

[tasks.fmt]
run = "uv run ruff format ."

[tasks.typecheck]
run = "uv run ty check src demo"

[tasks.actionlint]
run = "actionlint"

[tasks.check]
depends = ["actionlint", "lint", "typecheck", "test"]

[tasks.build]
run = "uv build"

[tasks.demo]
description = "Run the real local Docker/Terraform demo"
run = "uv run python demo/run.py run"

[tasks.demo-reset]
description = "Recreate and run the local demo from scratch"
run = "uv run python demo/run.py reset"

[tasks.demo-clean]
description = "Remove the local demo resources and state"
run = "uv run python demo/run.py clean"
