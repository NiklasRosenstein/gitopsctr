[tools]
actionlint = "latest"
oras = "latest"
helm = "latest"
kind = "0.32.0"
minikube = "1.38.1"
kubectl = "latest"
python = "3.12"
terraform = "latest"
uv = "0.12.5"

[tasks.sync]
run = "uv sync --all-groups"

[tasks.test]
run = "uv run pytest -q -n auto"

[tasks.coverage]
description = "Run the test suite with branch coverage and enforce the baseline"
run = "uv run pytest -q -n auto --cov=gitopsctr --cov-branch --cov-report=term-missing"

[tasks.lint]
run = "uv run ruff check ."

[tasks.fmt]
run = "uv run ruff format ."

[tasks.typecheck]
run = "uv run ty check src demo"

[tasks.actionlint]
run = "actionlint"

[tasks.schemas]
run = "uv run gitopsctr schemas export docs/schemas"

[tasks.schemas-check]
run = "uv run gitopsctr schemas export docs/schemas --check"

[tasks.resource-model]
run = "uv run python -m gitopsctr.resource_model_export export docs/resource-model.md"

[tasks.resource-model-check]
run = "uv run python -m gitopsctr.resource_model_export export docs/resource-model.md --check"

[tasks.docs]
run = "uv run mkdocs build --strict"

[tasks.docs-serve]
description = "Serve the documentation with live reload"
run = "uv run mkdocs serve"

[tasks.check]
depends = ["actionlint", "coverage", "docs", "lint", "resource-model-check", "schemas-check", "typecheck"]

[tasks.build]
run = "uv build"

[tasks.demo-docker]
description = "Run, clean, or accept the partitioned Docker Stack demo"
usage = '''
arg "[operation]" default="run" {
  choices "run" "clean" "acceptance"
}
'''
run = 'uv run python -m demo.docker.run "${usage_operation?}"'

[tasks.demo-k8s]
description = "Run, clean, or accept the promoted/unpartitioned-preview Kubernetes Stack demo"
usage = '''
arg "[operation]" default="run" {
  choices "run" "clean" "acceptance"
}
flag "--preview" help="Apply an unpartitioned preview Stack"
flag "--delivery <delivery>" default="direct" {
  choices "direct" "argocd"
}
'''
run = 'uv run python -m demo.k8s.run "${usage_operation?}" ${usage_preview:+--preview} --delivery "${usage_delivery?}"'
