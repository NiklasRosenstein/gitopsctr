[tools]
actionlint = "latest"
oras = "latest"
python = "3.12"
uv = "latest"

[tasks.sync]
run = "uv sync --all-groups"

[tasks.test]
run = "uv run pytest -q"

[tasks.lint]
run = "uv run ruff check ."

[tasks.fmt]
run = "uv run ruff format ."

[tasks.typecheck]
run = "uv run ty check src"

[tasks.actionlint]
run = "actionlint"

[tasks.check]
depends = ["actionlint", "lint", "typecheck", "test"]

[tasks.build]
run = "uv build"
