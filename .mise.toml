[tools]
actionlint = "latest"
oras = "latest"
helm = "latest"
kind = "0.32.0"
minikube = "1.38.1"
kubectl = "latest"
python = "3.12"
terraform = "latest"
uv = "latest"

[tasks.sync]
run = "uv sync --all-groups"

[tasks.test]
run = "uv run pytest -q"

[tasks.lint]
run = "uv run ruff check ."

[tasks.fmt]
run = "uv run ruff format ."

[tasks.typecheck]
run = "uv run ty check src demo"

[tasks.actionlint]
run = "actionlint"

[tasks.schemas]
run = "uv run gitopsctr schemas export docs/schemas"

[tasks.schemas-check]
run = "uv run gitopsctr schemas export docs/schemas --check"

[tasks.migrate-documents]
description = "Preview the one-shot JSON-to-YAML resource migration"
run = "uv run python tools/migrate_documents.py --project-name gitopsctr"

[tasks.docs]
run = "uv run mkdocs build --strict"

[tasks.docs-serve]
description = "Serve the documentation with live reload"
run = "uv run mkdocs serve"

[tasks.check]
depends = ["actionlint", "docs", "lint", "schemas-check", "typecheck", "test"]

[tasks.build]
run = "uv build"

[tasks.demo-docker]
description = "Run, clean, or accept the source-tracked Docker Stack demo"
usage = '''
arg "[operation]" default="run" {
  choices "run" "clean" "acceptance"
}
'''
run = 'uv run python -m demo.docker.run "${usage_operation?}"'

[tasks.demo-k8s]
description = "Run, clean, or accept the promoted/direct-preview Kubernetes Stack demo"
usage = '''
arg "[operation]" default="run" {
  choices "run" "clean" "acceptance"
}
flag "--preview" help="Use a directly managed preview Stack"
flag "--delivery <delivery>" default="direct" {
  choices "direct" "argocd"
}
'''
run = 'uv run python -m demo.k8s.run "${usage_operation?}" ${usage_preview:+--preview} --delivery "${usage_delivery?}"'
