[project]
name = "gitopsctr"
version = "0.1.0"
description = "A local-first GitOps deployment reconciler."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Niklas Rosenstein" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["PyYAML>=6"]

[project.urls]
Repository = "https://github.com/NiklasRosenstein/gitopsctr"

[project.scripts]
gitopsctr = "gitopsctr.cli:main"

[project.entry-points."gitopsctr.drivers"]
frontend-s3-cloudfront = "gitopsctr.contrib.driver.frontend_s3_cloudfront:PLUGIN"
oci-images = "gitopsctr.contrib.driver.oci_images:PLUGIN"
terraform = "gitopsctr.contrib.driver.terraform:PLUGIN"
vite-oci-bundle = "gitopsctr.contrib.driver.vite_oci_bundle:PLUGIN"
kubernetes-manifests = "gitopsctr.contrib.driver.kubernetes_manifests:PLUGIN"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
  "ty>=0.0.1a16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitopsctr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
